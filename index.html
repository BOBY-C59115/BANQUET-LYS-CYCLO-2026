<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Banquet Lys Cyclo">
<meta name="theme-color" content="#08101f">
<title>Banquet Lys Cyclo — Réservation &amp; plan de table</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--j:#CCFF00;--jg:rgba(204,255,0,.13);--b:#08101f;--bm:#0d1c35;--bc:#101e3c;--bb:#1b2f5a;--bh:#152340;--t:#ddeeff;--td:#7e9cc9;--R:#FF5555;--V:#00E676;--O:#FFA726;--P:#cc66ff;--ra:14px;--rs:9px;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'Barlow',sans-serif;background:var(--b);color:var(--t);overflow-x:hidden;}
input,textarea,select,button{font-family:'Barlow',sans-serif;font-size:15px;}
button{cursor:pointer;}
#splash{position:fixed;inset:0;background:var(--b);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:opacity .5s;}
#splash.hide{opacity:0;pointer-events:none;}
.sb{font-family:'Bebas Neue',sans-serif;font-size:50px;color:var(--j);letter-spacing:4px;}
.sy{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:6px;margin-top:-6px;}
.ss{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:3px;color:var(--td);text-transform:uppercase;margin-top:14px;}
#screenLogin,#screenApp{display:none;min-height:100vh;}
#screenLogin.show{display:flex;flex-direction:column;align-items:center;padding:24px 16px;}
#screenApp.show{display:block;padding-bottom:40px;}
.llogo{text-align:center;margin:10px 0 4px;}
.lb{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--j);letter-spacing:3px;line-height:1;}
.ly{font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:5px;}
.lsub{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--td);text-align:center;margin:8px 0 18px;max-width:360px;line-height:1.5;}
.lbox,.card{background:var(--bm);border:1px solid var(--bb);border-radius:var(--ra);padding:14px;width:100%;}
.lbox{max-width:400px;padding:18px 16px;}
.lq{font-family:'Bebas Neue',sans-serif;font-size:19px;text-align:center;margin-bottom:14px;letter-spacing:1px;}
.fg{margin-bottom:11px;}
.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--td);margin-bottom:4px;}
.fi{width:100%;background:var(--bc);border:1px solid var(--bb);color:var(--t);border-radius:var(--rs);padding:10px 11px;outline:none;}
.fi:focus{border-color:var(--j);}
select.fi{appearance:auto;}
.lhint{font-size:11px;color:var(--td);margin-top:3px;}
.bp{background:var(--j);color:#08101f;border:0;border-radius:var(--rs);padding:11px 16px;font-weight:700;letter-spacing:.3px;}
.bp:disabled{opacity:.4;}
.bs{background:transparent;color:var(--t);border:1px solid var(--bb);border-radius:var(--rs);padding:9px 13px;font-weight:600;}
.bs.on{border-color:var(--j);color:var(--j);background:var(--jg);}
.bd{background:transparent;color:var(--R);border:1px solid rgba(255,85,85,.4);border-radius:var(--rs);padding:8px 11px;font-weight:600;}
header{background:var(--bm);border-bottom:3px solid var(--j);padding:0 12px;padding-top:env(safe-area-inset-top,0);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;height:calc(54px + env(safe-area-inset-top,0));}
.hlogo{font-family:'Bebas Neue',sans-serif;font-size:21px;color:var(--j);letter-spacing:2px;display:flex;align-items:baseline;gap:6px;}
.hlogo span{font-size:11px;color:var(--td);letter-spacing:1px;}
.hdr-r{display:flex;align-items:center;gap:8px;}
.rchip{padding:2px 8px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(255,215,0,.18);color:#FFD700;}
.hav{width:34px;height:34px;border-radius:50%;background:var(--j);color:#08101f;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;}
nav{display:flex;background:var(--bm);border-bottom:1px solid var(--bb);position:sticky;top:calc(54px + env(safe-area-inset-top,0));z-index:99;}
.nb{flex:1;background:none;border:0;color:var(--td);padding:8px 2px 7px;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:1px;border-bottom:3px solid transparent;}
.nb span{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.5px;text-transform:uppercase;font-weight:700;}
.nb.active{color:var(--j);border-bottom-color:var(--j);}
.view{display:none;padding:14px 12px;max-width:640px;margin:0 auto;}
.view.active{display:block;}
.hero{background:linear-gradient(135deg,var(--bh),var(--bm));border:1px solid var(--bb);border-radius:var(--ra);padding:16px;margin-bottom:12px;}
.hero h1{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--j);letter-spacing:1.5px;line-height:1.05;}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;}
.pill{background:var(--jg);border:1px solid rgba(204,255,0,.3);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--j);}
.banner{border-radius:var(--rs);padding:10px 12px;font-size:14px;margin-bottom:12px;}
.banner.warn{background:rgba(255,167,38,.14);border:1px solid rgba(255,167,38,.5);color:#ffcf8a;}
.banner.ok{background:rgba(0,230,118,.12);border:1px solid rgba(0,230,118,.4);color:#8bf5b9;}
.h2{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:1.2px;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;}
.conv{display:flex;flex-direction:column;gap:9px;margin-bottom:9px;}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
.cname{font-weight:700;font-size:16px;}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--bb);color:var(--t);}
.chip.g{background:rgba(0,230,118,.18);color:var(--V);}
.chip.o{background:rgba(255,167,38,.2);color:var(--O);}
.chip.r{background:rgba(255,85,85,.2);color:var(--R);}
.chip.j{background:var(--jg);color:var(--j);}
.seg{display:flex;gap:6px;flex-wrap:wrap;}
.seg button{flex:1;min-width:100px;}
.muted{color:var(--td);font-size:13px;}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:10px;}
.stat{background:var(--bc);border:1px solid var(--bb);border-radius:var(--rs);padding:9px 6px;text-align:center;}
.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--j);line-height:1.1;}
.stat span{font-size:11px;color:var(--td);font-weight:600;}
.tcard{margin-bottom:9px;}
.tcard.low{border-left:4px solid var(--O);} .tcard.okk{border-left:4px solid var(--V);} .tcard.full{border-left:4px solid var(--j);} .tcard.over{border-left:4px solid var(--R);}
.occ{margin-top:7px;display:flex;flex-direction:column;gap:3px;font-size:14px;}
.occ div{display:flex;justify-content:space-between;gap:6px;}
.occ .me{color:var(--j);font-weight:700;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px;}
.tbtn{background:var(--bc);border:1px solid var(--bb);color:var(--t);border-radius:var(--rs);padding:8px 2px;text-align:center;line-height:1.15;}
.tbtn b{font-family:'Bebas Neue',sans-serif;font-size:22px;display:block;}
.tbtn small{font-size:11px;color:var(--td);}
.tbtn.cur{border-color:var(--j);background:var(--jg);}
.tbtn.empty{opacity:.75;}
.tbtn:disabled{opacity:.28;cursor:not-allowed;}
.ov{position:fixed;inset:0;background:rgba(3,8,18,.78);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.ov.show{display:flex;}
.sheet{background:var(--bm);border:1px solid var(--bb);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0));}
.sheet h3{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1.2px;margin-bottom:10px;color:var(--j);}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.tabs button{flex:1;}
.pick{width:100%;text-align:left;background:var(--bc);border:1px solid var(--bb);color:var(--t);border-radius:var(--rs);padding:9px 11px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.pick:disabled{opacity:.35;}
table.t{width:100%;border-collapse:collapse;font-size:13px;}
table.t th,table.t td{padding:6px 5px;border-bottom:1px solid var(--bb);text-align:left;}
table.t th{color:var(--td);font-size:11px;text-transform:uppercase;letter-spacing:.6px;}
table.t td.n,table.t th.n{text-align:right;}
.adm-row{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bb);}
.adm-row .ctl{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;}
.adm-row .ctl select,.adm-row .ctl input{width:auto;flex:1;min-width:84px;padding:6px 7px;font-size:13px;}
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--j);color:#08101f;font-weight:700;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s;z-index:900;max-width:92vw;text-align:center;}
#toast.show{opacity:1;transform:translate(-50%,0);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.fbadge{display:flex;justify-content:space-between;align-items:center;gap:8px;}
#ovPrint{position:fixed;inset:0;z-index:700;background:#dfe5ee;overflow:auto;display:none;color:#000;}
#ovPrint.show{display:block;}
.ptool{position:sticky;top:0;z-index:5;background:var(--bm);color:var(--t);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:3px solid var(--j);}
.ptool select,.ptool label.bs{font-size:14px;}
.ptool select{background:var(--bc);color:var(--t);border:1px solid var(--bb);border-radius:var(--rs);padding:8px;}
.ptool .pinfo{flex-basis:100%;font-size:12px;color:var(--td);}
.page{background:#fff;width:210mm;height:297mm;margin:12px auto;padding:8mm;box-shadow:0 2px 12px rgba(0,0,0,.25);break-after:page;page-break-after:always;overflow:hidden;position:relative;font-family:'Barlow',Arial,sans-serif;color:#222;}
@media (max-width:820px){#printArea{zoom:.4;}}
/* chevalets (marque-places) : 2 × 4 par page A4, pliés en tente */
.cgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:0;height:100%;}
.chev{border:.3mm solid #333;display:flex;flex-direction:column;background:#f3f3f3;overflow:hidden;}
.chev-top{flex:1;display:flex;align-items:center;justify-content:center;border-bottom:.3mm dashed #999;background:#fff;}
.rot{transform:rotate(180deg);text-align:center;display:flex;flex-direction:column;align-items:center;gap:1mm;padding:2mm;}
.rot img{max-height:20mm;max-width:60mm;}
.rot .ct{font-family:'Bebas Neue',sans-serif;font-size:15pt;letter-spacing:1px;line-height:1;}
.rot .cd{font-size:9pt;}
.rot .ctb{font-family:'Bebas Neue',Arial,sans-serif;font-size:16pt;letter-spacing:2px;color:#CC6600;line-height:1;margin-top:1mm;}
.chev-bot{flex:1;display:flex;flex-direction:column;}
.chev-bot .tb{text-align:center;font-size:8pt;letter-spacing:1px;padding-top:1.5mm;}
.chev-bot .cnm{flex:1;display:flex;align-items:center;justify-content:space-between;padding:0 6mm;gap:4mm;color:#CC6600;}
.pn{font-weight:500;line-height:1;} .pn.s1{font-size:25pt;} .pn.s2{font-size:20pt;} .pn.s3{font-size:15pt;}
.nn{font-size:10pt;text-align:right;}
.band{height:12mm;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12pt;letter-spacing:1px;}
/* plan par table */
.rh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1mm solid #CCFF00;padding-bottom:3mm;margin-bottom:5mm;}
.rh h1{font-family:'Bebas Neue',sans-serif;font-size:44pt;line-height:1;color:#0d1c35;letter-spacing:2px;}
.rh .rs{font-size:10pt;color:#555;}
.rcount{display:flex;gap:2mm;flex-wrap:wrap;justify-content:flex-end;}
.rcount span{padding:1.5mm 3mm;border-radius:2mm;font-weight:700;font-size:10pt;}
.seat{display:flex;align-items:center;gap:4mm;border:.3mm solid #bbb;border-radius:2mm;margin-bottom:2.5mm;overflow:hidden;height:17mm;}
.seat .sn{width:12mm;align-self:stretch;display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue',sans-serif;font-size:20pt;background:#0d1c35;color:#CCFF00;}
.seat .sname{flex:1;font-size:17pt;color:#CC6600;}
.seat .sname b{color:#444;font-size:12pt;font-weight:500;margin-left:2mm;}
.seat .snote{font-size:8pt;color:#a33;display:block;}
.seat .sband{width:46mm;align-self:stretch;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12pt;letter-spacing:1px;}
.legend{position:absolute;left:8mm;right:8mm;bottom:6mm;display:flex;gap:5mm;font-size:9pt;color:#555;align-items:center;}
.legend i{display:inline-block;width:4mm;height:4mm;border-radius:1mm;vertical-align:middle;margin-right:1.5mm;}
@media print{
  html,body{background:#fff!important;}
  body>*:not(#ovPrint){display:none!important;}
  #ovPrint{position:static!important;display:block!important;background:#fff;overflow:visible;}
  .ptool{display:none!important;}
  #printArea{zoom:1!important;}
  .page{margin:0;box-shadow:none;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  @page{size:A4 portrait;margin:0;}
}
@media print{header,nav,.noprint{display:none!important;}}
</style>

<div id="splash"><div class="sb">BANQUET</div><div class="sy">LYS CYCLO</div><div class="ss">Chargement…</div></div>

<div id="screenLogin">
  <div class="llogo"><div class="lb">BANQUET</div><div class="ly">LYS CYCLO</div></div>
  <div class="lsub">Réserve ta place au banquet annuel du club, choisis ton plat et ta table. Pas de mot de passe : remplis simplement les 3 champs ci-dessous.</div>

    <div class="fg"><label class="fl">Ton nom</label><input class="fi" id="rNom" placeholder="Ex : Dupont" maxlength="30" autocomplete="family-name"></div>
    <div class="fg"><label class="fl">Ton numéro de mobile</label><input class="fi" id="rTel" placeholder="06 12 34 56 78" inputmode="tel" maxlength="20" autocomplete="tel"><div class="lhint">Sert uniquement à te reconnaître si tu changes de téléphone.</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

// ═══ MÊME PROJET FIREBASE QUE LES AUTRES APPLIS DU CLUB — données du banquet sous "banquet2026/" ═══
const FB = {
  apiKey: "AIzaSyAesDUe-NVkmWNqnFUouJNAzP1q4Y6WU5s",
  authDomain: "agenda-lys-cylo.firebaseapp.com",
  databaseURL: "https://agenda-lys-cylo-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "agenda-lys-cylo",
  storageBucket: "agenda-lys-cylo.firebasestorage.app",
  messagingSenderId: "660373080006",
  appId: "1:660373080006:web:acb61ee1523acaa38ad4c7"
};
const app = initializeApp(FB);
const db = getDatabase(app);
const ROOT = "banquet2026";

// ═══ ÉTAT ═══
const DEF = {
  titre:"Banquet annuel Lys Cyclo", date:"à définir", heure:"", lieu:"à définir",
  tarifAdulte:45, tarifEnfant:18, coutAdulte:42, coutEnfant:20, adherentGratuit:true,
  platA:"Viande", platB:"Poisson", platEnfant:"Menu enfant",
  tableMin:8, tableMax:12, nbTables:24, ouvert:true, dateLimite:"",
  extraA:0, extraB:0, extraE:0
};
let CFG = {...DEF};
let CV = {};   // convives
let RS = {};   // réservations (par réservant)
let ADH = {};  // annuaire adhérents importé (cotisation à jour ou non)
let DRAFT = null; // brouillon du formulaire de saisie
let MB = [];   // annuaire officiel des membres
let CU = null; // utilisateur connecté
let view = "mine", adminTab = "synth", planFilter = "";
let ready = false;

// ═══ UTILITAIRES ═══
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = (v, d=0) => { const n = Number(v); return isFinite(n) ? n : d; };
const eur = n => (Math.round(n*100)/100).toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:2}) + " €";
const cap = s => (s||"").toLowerCase().replace(/(^|[\s'-])([a-zà-ÿ])/g, (m,a,b)=>a+b.toUpperCase());
const initials = (p,n) => ((p||"?")[0] + (n||"?")[0]).toUpperCase();
function normPhone(raw){
  let s = (raw||"").trim().replace(/[^\d+]/g,"");
  if (s.startsWith("+33")) s = "0" + s.slice(3);
  else if (s.startsWith("0033")) s = "0" + s.slice(4);
  return s;
}
const isValidFrMobile = s => /^0[67]\d{8}$/.test(s);
const isAdmin = () => !!CU && (CU.role==="admin" || CU.role==="superviseur");
const todayISO = () => new Date().toLocaleDateString("sv-SE");
const frDate = iso => /^\d{4}-\d{2}-\d{2}$/.test(iso||"") ? iso.split("-").reverse().join("/") : (iso||"");
const deadlinePassed = () => /^\d{4}-\d{2}-\d{2}$/.test(CFG.dateLimite||"") && todayISO() > CFG.dateLimite;
const isOpen = () => CFG.ouvert !== false && !deadlinePassed();
const canEdit = () => isOpen() || isAdmin();
const uid = () => "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const platName = c => c==="A" ? CFG.platA : c==="B" ? CFG.platB : CFG.platEnfant;
const platIcon = c => c==="A" ? "🥩" : c==="B" ? "🐟" : "🧒";
const typeName = t => t==="enfant" ? "Enfant" : "Adulte";
const convArr = () => Object.entries(CV).map(([id,c]) => ({id, ...c}));
const mine = () => convArr().filter(c => c.owner === CU.id).sort((a,b)=>(a.ts||0)-(b.ts||0));
const fullName = c => cap(c.prenom) + " " + (c.nom||"").toUpperCase();
const normStr = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const adhKey = (p,n) => normStr(n) + "_" + normStr(p);
// ── Fonction de vérification : la personne est-elle adhérente ? à jour de cotisation ? ──
function lookupAdh(prenom, nom, tel){
  let a = ADH[adhKey(prenom, nom)];
  if (!a && tel){ const t = normPhone(tel); a = Object.values(ADH).find(x => x.tel && normPhone(x.tel)===t && normStr(x.nom)===normStr(nom)); }
  return a || null;
}
const kidInfo = () => ({price:num(CFG.tarifEnfant), club:false, cls:"j", label:"Enfant 5-12 ans — " + eur(CFG.tarifEnfant)});
function adultInfo(prenom, nom, tel){
  const p = num(CFG.tarifAdulte), a = lookupAdh(prenom, nom, tel);
  if (a && a.cotisation && CFG.adherentGratuit !== false) return {price:0, club:true, cls:"g", label:"✅ Adhérent à jour — pris en charge par le club"};
  if (a && a.cotisation) return {price:p, club:false, cls:"o", label:"Adhérent à jour — " + eur(p) + " à régler"};
  if (a) return {price:p, club:false, cls:"o", label:"Cotisation non à jour — " + eur(p) + " à régler"};
  return {price:p, club:false, cls:"o", label:(Object.keys(ADH).length ? "Non adhérent — " : "") + eur(p) + " à régler"};
}

// ═══ LOGIQUE MÉTIER ═══
function byTable(){
  const m = {};
  convArr().forEach(c => { if (c.table) (m[c.table] = m[c.table] || []).push(c); });
  return m;
}
const tableCount = (n, exclude=[]) => (byTable()[n]||[]).filter(c => !exclude.includes(c.id)).length;
function tableState(n){
  const k = tableCount(n);
  if (k > CFG.tableMax) return {k, cls:"over", chip:"r", label:"Surchargée"};
  if (k === CFG.tableMax) return {k, cls:"full", chip:"j", label:"Complète"};
  if (k < CFG.tableMin) return {k, cls:"low", chip:"o", label:"À compléter (min " + CFG.tableMin + ")"};
  return {k, cls:"okk", chip:"g", label:"OK"};
}
function ownerOf(id){ return RS[id] || {}; }
function ownerLabel(id){
  if (id === "admin") return "Ajouts organisateurs";
  const r = ownerOf(id);
  if (r.prenom || r.nom) return cap(r.prenom) + " " + (r.nom||"").toUpperCase();
  const s = CV["self_"+id]; return s ? fullName(s) : id;
}
const priceOf = c => convInfo(c).price;
const dueOf = owner => convArr().filter(c => c.owner===owner).reduce((s,c)=>s+priceOf(c),0);
function payList(o){
  const r = RS[o] || {}, out = [];
  Object.entries(r.paiements||{}).forEach(([id,p]) => out.push({id, ...p}));
  if (r.paye && r.paye.montant) out.push({id:"_legacy", ...r.paye});
  return out.sort((a,b)=>(a.date||"").localeCompare(b.date||""));
}
const paidOf = o => payList(o).reduce((s,p)=>s+num(p.montant),0);
function costOf(list){
  return list.reduce((s,c)=> s + (c.type==="enfant" ? num(CFG.coutEnfant) : num(CFG.coutAdulte)), 0);
}
function stats(){
  const l = convArr();
  const s = {total:l.length, adherent:0, adulte:0, enfant:0, A:0, B:0, E:0, sansTable:0, sansPlat:0};
  l.forEach(c => {
    s[c.type==="enfant"?"enfant":(priceOf(c)===0?"adherent":"adulte")]++;
    if (c.plat==="A"||c.plat==="B"||c.plat==="E") s[c.plat]++; else s.sansPlat++;
    if (!c.table) s.sansTable++;
  });
  return s;
}

// Affecte des convives à une table (contrôle de capacité sur données fraîches)
async function assignTable(ids, n, opts={}){
  n = Math.round(num(n));
  if (n < 0 || n > 99){ showT("Numéro de table invalide."); return false; }
  await fresh();
  if (n > 0){
    const k = tableCount(n, ids);
    if (k + ids.length > CFG.tableMax && !(isAdmin() && opts.force)){
      showT(`Table ${n} : il ne reste que ${Math.max(0, CFG.tableMax-k)} place(s).`); return false;
    }
  }
  const up = {}; ids.forEach(id => { if (CV[id]) up[`${id}/table`] = n; });
  await update(ref(db, `${ROOT}/convives`), up);
  return true;
}
window.applyTable = async (n) => {

window.joinPerson = async (tid) => {
  const ids = window._tIds || [];
  await fresh();
  const t = CV[tid]; if (!t) return;
  if (t.table){ if (await assignTable(ids, t.table)){ closeSheet(); showT(`Tu rejoins ${cap(t.prenom)} à la table ${t.table} 🎉`); } return; }
  // personne pas encore placée : on les place ensemble (avec son groupe non placé) sur la 1re table libre
  const group = convArr().filter(c => c.owner === t.owner && !c.table).map(c => c.id);
  const all = [...new Set([...group, ...ids])];
  if (all.length > CFG.tableMax){ showT("Groupe trop grand pour une table."); return; }
  let n = 0;
  for (let i = 1; i <= CFG.nbTables; i++){ if (tableCount(i) === 0){ n = i; break; } }
  if (!n){ showT("Aucune table vide disponible — choisis un numéro de table."); return; }
  await assignTable(all, n);
  closeSheet(); showT(`Vous êtes placés ensemble à la table ${n} 🎉`);
};

function renderPlan(keep){

function caterer(){
  const bt = byTable(), nums = Object.keys(bt).map(Number).sort((a,b)=>a-b);
  const rows = nums.map(n => {
    const l = bt[n], r = {n, k:l.length, A:0, B:0, E:0, none:0};
    l.forEach(c => { if (c.plat==="A"||c.plat==="B"||c.plat==="E") r[c.plat]++; else r.none++; });
    r.st = tableState(n); return r;
  });
  const tot = {A:0, B:0, E:0, none:0}; rows.forEach(r => { tot.A+=r.A; tot.B+=r.B; tot.E+=r.E; tot.none+=r.none; });
  const s = stats();
  const un = convArr().filter(c => !c.table); un.forEach(c => { if (c.plat==="A") tot.A++; else if (c.plat==="B") tot.B++; else if (c.plat==="E") tot.E++; else tot.none++; });
  const sizes = {}; rows.forEach(r => sizes[r.k] = (sizes[r.k]||0) + 1);
  const A = tot.A + num(CFG.extraA), B = tot.B + num(CFG.extraB), E = tot.E + num(CFG.extraE);
  const cout = (A + B) * num(CFG.coutAdulte) + E * num(CFG.coutEnfant);
  return {rows, tot, sizes, A, B, E, cout, s};
}

function parseCSV(txt){
  txt = txt.replace(/^\uFEFF/, ""); const first = txt.split(/\r?\n/)[0] || "";
  const d = [";","\t",","].sort((a,b) => first.split(b).length - first.split(a).length)[0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < txt.length; i++){
    const ch = txt[i];
    if (q){ if (ch === '"'){ if (txt[i+1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === d){ row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r"){ if (ch === "\r" && txt[i+1] === "\n") i++; row.push(cur); cur = ""; rows.push(row); row = []; }
    else cur += ch;
  }
  if (cur !== "" || row.length){ row.push(cur); rows.push(row); }
  return rows;
}
function parseAdhRows(rows){
  let hi = -1, col = {};
  for (let r = 0; r < Math.min(rows.length, 10); r++){
    const c = {};
    rows[r].map(normStr).forEach((h, j) => {
      if (!h) return;
      if (h.includes("PRENOM")){ if (c.prenom === undefined) c.prenom = j; }
      else if (h === "NOM" || h === "NOMDEFAMILLE" || h === "NOMS"){ if (c.nom === undefined) c.nom = j; }
      else if (/TEL|MOBILE|PORTABLE/.test(h)){ if (c.tel === undefined) c.tel = j; }
      else if (/COTIS|AJOUR|ADHES/.test(h)){ if (c.cot === undefined) c.cot = j; }
    });
    if (c.prenom !== undefined && c.nom !== undefined){ hi = r; col = c; break; }
  }
  if (hi < 0) return {list:[], skipped:0, err:"En-têtes introuvables : la 1re ligne doit contenir « Nom » et « Prénom »."};
  if (col.cot === undefined) return {list:[], skipped:0, err:"Colonne « Cotisation à jour » introuvable dans l'en-tête."};
  const YES = new Set(["OUI","O","X","1","TRUE","VRAI","OK","YES","Y","AJOUR","PAYE","PAYEE"]);
  const map = new Map(); let skipped = 0;
  rows.slice(hi+1).forEach(r => {
    const prenom = String(r[col.prenom] ?? "").trim(), nom = String(r[col.nom] ?? "").trim();
    if (!prenom && !nom) return;
    if (!prenom || !nom){ skipped++; return; }
    let tel = col.tel !== undefined ? normPhone(String(r[col.tel] ?? "")) : "";
    if (/^[67]\d{8}$/.test(tel)) tel = "0" + tel;
    map.set(adhKey(prenom, nom), {prenom:cap(prenom), nom:nom.toUpperCase(), tel, cotisation: YES.has(normStr(r[col.cot]))});
  });
  return {list:[...map.values()], skipped, err:""};
}
window.pickAdh = async inp => {
  const f = inp.files[0]; if (!f) return;
  try {
    let rows;
    if (/\.csv$/i.test(f.name)) rows = parseCSV(await f.text());
    else {
      if (typeof ExcelJS === "undefined") throw new Error("ExcelJS non chargé");
      const wb = new ExcelJS.Workbook(); await wb.xlsx.load(await f.arrayBuffer());
      const ws = wb.worksheets[0]; rows = [];
      ws.eachRow({includeEmpty:false}, row => { const v = []; row.eachCell({includeEmpty:true}, (cell, n) => { v[n-1] = cellText(cell.value); }); rows.push(Array.from(v, x => x ?? "")); });
    }
    window._imp = parseAdhRows(rows);
  } catch(e){ window._imp = {list:[], skipped:0, err:"Lecture impossible : " + e.message}; }
  renderAdmin();
};

let pending = 3;
const first = () => { if (--pending === 0){ ready = true; $("splash").classList.add("hide"); render(); } };
const guard = (cb) => { let done = false; return snap => { cb(snap); if (!done){ done = true; first(); } }; };
onValue(ref(db, "membres"), snap => { MB = Object.entries(snap.val()||{}).map(([id,d])=>({id,...d})); if (ready) render(); }, () => {});
onValue(ref(db, `${ROOT}/config`), guard(snap => { CFG = {...DEF, ...(snap.val()||{})}; if (ready) render(); }), err => showT("Connexion impossible : " + err.message));
onValue(ref(db, `${ROOT}/reservations`), guard(snap => { RS = snap.val() || {}; if (ready) render(); }), () => {});
onValue(ref(db, `${ROOT}/convives`), snap => { CV = snap.val() || {}; if (ready){ if (!document.querySelector("#ovMain.show")) render(); else if (view==="admin"||view==="plan"||view==="mine") { /* sheet ouverte : on ne re-rend pas pour ne pas perdre la saisie */ } } }, () => {});
onValue(ref(db, `${ROOT}/adherents`), snap => { ADH = snap.val() || {}; if (ready && !document.querySelector("#ovMain.show")) render(); }, () => {});
// "membres" compte aussi pour le démarrage
get(ref(db, "membres")).then(s => { MB = Object.entries(s.val()||{}).map(([id,d])=>({id,...d})); }).catch(()=>{}).finally(first);
// filet de sécurité si Firebase tarde
setTimeout(() => { if (!ready){ pending = 0; ready = true; $("splash").classList.add("hide"); render(); } }, 4500);

// ═══ DÉMARRAGE ═══
(function init(){
  const saved = localStorage.getItem("banquet2026_user_v1");
  if (saved){ try { CU = JSON.parse(saved); enterApp(); return; } catch(e){} }
  $("screenLogin").classList.add("show");
})();
</script>
